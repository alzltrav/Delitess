name: Deploy web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -f pubspec.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pubspec.yaml yet. Add your Flutter app and this workflow will deploy it."
          fi
          if [ "$IS_PRIVATE" = "true" ]; then
            echo "::warning::This repository is private, so GitHub Pages cannot publish it and the deploy step is skipped. Make the repository public (Settings > General > Danger Zone > Change visibility) to get your live link."
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - if: steps.check.outputs.ready == 'true'
        run: flutter pub get

      - name: Create placeholder .env for web build
        if: steps.check.outputs.ready == 'true'
        run: touch .env

      - if: steps.check.outputs.ready == 'true'
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - if: steps.check.outputs.ready == 'true'
        run: flutter test
        continue-on-error: true

      - name: Build web
        if: steps.check.outputs.ready == 'true'
        env:
          DUMMY: unused
        run: |
          flutter build web --release \
            --base-href "/${{ github.event.repository.name }}/"

      - if: steps.check.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5